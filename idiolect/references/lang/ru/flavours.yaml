# Language flavour detectors for Russian (spec §34.2): traces of another language in Russian prose.
# Each pattern is case-insensitive and multi-line, must match every line of `examples` and none of `not`
# (langpack.py check). Keep them narrow: a detector that fires on native Russian is worse than none.
version: "1.0"
detectors:
  - id: delat-smysl
    name: "'делать смысл'"
    origins: [en]
    how: "'это делает смысл' по образцу 'it makes sense', где по-русски 'это имеет смысл'."
    pattern: '\bдела(?:ет|ют|ть|ло|ли)\s+(?:много\s+|больше\s+|никакого\s+)?смысл\b'
    examples:
      - "Это делает смысл."
      - "Не делает никакого смысл."
    not:
      - "Это имеет смысл."
      - "Он делает смысловой анализ."

  - id: horoshee-vremya
    name: "'иметь хорошее время'"
    origins: [en]
    how: "'иметь хорошее время' по образцу 'have a good time', где по-русски 'хорошо провести время'."
    pattern: '\bиме(?:ть|ли|л|ла|ем|ете)\s+(?:очень\s+)?хорошее\s+время\b'
    examples:
      - "Мы имели хорошее время на конференции."
    not:
      - "Мы хорошо провели время на конференции."
      - "Сейчас хорошее время для перемен."

  - id: adresovat-problemu
    name: "'адресовать проблему'"
    origins: [en]
    how: "'адресовать проблему' по образцу 'address a problem', где по-русски 'решать проблему' или 'заняться вопросом'."
    pattern: '\bадресова(?:ть|л|ла|ли|ло)\s+(?:эту\s+|эти\s+|этот\s+)?(?:проблем[уы]|вопрос[ыа]?)\b'
    examples:
      - "Нам нужно адресовать эту проблему."
    not:
      - "Нам нужно решить эту проблему."
      - "Он адресовал письмо министру."

  - id: brat-mesto
    name: "'брать место'"
    origins: [en]
    how: "'встреча берёт место' по образцу 'take place', где по-русски 'состоится' или 'имеет место'."
    pattern: '\b(?:берёт|берет|брало|брала|взяло|взяла)\s+место\b'
    examples:
      - "Встреча берёт место в понедельник."
    not:
      - "Встреча состоится в понедельник."
      - "Он занял место у окна."

  - id: zvonit-nazad
    name: "'звонить назад'"
    origins: [en]
    how: "'позвонить назад' по образцу 'call back', где по-русски 'перезвонить'."
    pattern: '\b(?:по)?звон(?:ить|ю|ит|и|ил|ила|или)\s+(?:\w+\s+)?назад\b'
    examples:
      - "Я позвоню тебе назад завтра."
    not:
      - "Я перезвоню тебе завтра."
      - "Он пошёл назад."

  - id: delaet-schastlivym
    name: "'делает меня счастливым'"
    origins: [en]
    how: "'это делает меня счастливым' по образцу 'it makes me happy', где по-русски 'меня это радует'."
    pattern: '\bдела(?:ет|ют|ло|ли)\s+(?:меня|тебя|его|её|ее|нас|вас|их)\s+(?:счастлив\w*|грустн\w*|сильн\w*|лучше)\b'
    examples:
      - "Это делает меня счастливым."
    not:
      - "Меня это радует."
      - "Он делает мне кофе."
