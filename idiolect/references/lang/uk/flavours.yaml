# Language flavour detectors for Ukrainian (spec §34.2): traces of another language in Ukrainian prose.
# Each pattern is case-insensitive and multi-line, must match every line of `examples` and none of `not`
# (langpack.py check). Keep them narrow: a detector that fires on native Ukrainian is worse than none.
version: "1.0"
detectors:
  - id: robyty-sens
    name: "'робити сенс'"
    origins: [en]
    how: "'це робить сенс' за зразком 'it makes sense', де українською 'це має сенс'."
    pattern: '\bроб(?:ить|лять|ити|ило|ив)\s+(?:багато\s+|більше\s+|жодного\s+)?сенс\b'
    examples:
      - "Це робить сенс."
    not:
      - "Це має сенс."
      - "Він робить сенсаційні заяви."

  - id: harnyi-chas
    name: "'мати гарний час'"
    origins: [en]
    how: "'мати гарний час' за зразком 'have a good time', де українською 'гарно провести час'."
    pattern: '\bма(?:ти|ли|в|ла|ємо|єте)\s+(?:дуже\s+)?(?:гарний|добрий)\s+час\b'
    examples:
      - "Ми мали гарний час на конференції."
    not:
      - "Ми гарно провели час на конференції."
      - "Зараз добрий час для змін."

  - id: na-protiazi
    name: "'на протязі' (русизм)"
    origins: [ru]
    how: "'на протязі' про час за зразком російського 'на протяжении', де українською 'протягом' ('на протязі' - це протяг, вітер)."
    pattern: '\bна\s+протязі\s+(?:року|років|дня|днів|тижня|тижнів|місяця|місяців|години|годин|століття|століть|часу|всього|усього|цього|цих|останніх|багатьох|кількох|довгого|\d+)\b'
    examples:
      - "Це тривало на протязі року."
    not:
      - "Це тривало протягом року."
      - "Він стояв на протязі."

  - id: pryimaty-uchast
    name: "'приймати участь' (русизм)"
    origins: [ru]
    how: "'приймати участь' за зразком російського 'принимать участие', де українською 'брати участь'."
    pattern: '\bприйма(?:ти|ю|є|ють|в|ла|ли|ємо)\s+участь\b'
    examples:
      - "Я приймаю участь у конференції."
    not:
      - "Я беру участь у конференції."

  - id: sliduiuchyi
    name: "'слідуючий' (русизм)"
    origins: [ru]
    how: "'слідуючий' за зразком російського 'следующий', де українською 'наступний'."
    pattern: '\bслідуюч(?:ий|а|е|і|ого|ому|ій|их|им)\b'
    examples:
      - "Слідуючий крок простий."
    not:
      - "Наступний крок простий."

  - id: yavliaietsia
    name: "'являється' (русизм)"
    origins: [ru]
    how: "'являється' + орудний відмінок у значенні 'є' за зразком російського 'является' ('являється привид' - це інше)."
    pattern: '\bявля(?:ється|ються)\s+(?:\w+\s+)?\w+(?:ою|ею|єю|ом|ем|єм|ами|ями|ими|іми|им|ім)\b'
    examples:
      - "Це являється проблемою."
    not:
      - "Це є проблемою."
      - "Вночі являється привид."
